name: Build crosstool-ng

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  CROSSTOOL_NG_REPO: rafaelmartins/crosstool-ng
  CROSSTOOL_NG_REF: 1e9bf8151513b054f60f34bc89507c31dc242cf0

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CROSSTOOL_NG_REPO }}
          ref: ${{ env.CROSSTOOL_NG_REF }}
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt install -y help2man libtool-bin

      - name: Install dependencies (MacOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install bash gnu-sed help2man texinfo

      - name: Get tag name
        id: name
        run: |
          if [[ ${CROSSTOOL_NG_REF} = crostool-ng-* ]]; then
            echo "name=${CROSSTOOL_NG_REF}" >> $GITHUB_OUTPUT
          else
            echo "name=$(git describe --abbrev=4 HEAD | sed -e 's/\([0-9]\)-/\1./' -e 's/-g/-/')" >> $GITHUB_OUTPUT
          fi

      - name: Store tag name
        run: |
          echo "${{ steps.name.outputs.name }}" > P

      - name: Get tarball os/arch
        id: os_arch
        run: |
          if [[ "${{ matrix.os }}" = ubuntu-* ]]; then
            echo "os_arch=linux-$(uname -m)" >> $GITHUB_OUTPUT
          else
            echo "os_arch=darwin-$(uname -m)" >> $GITHUB_OUTPUT
          fi

      - name: Build crosstool-ng
        run: |
          ./bootstrap
          ./configure --prefix=/usr
          make LDFLAGS="-all-static"
          make DESTDIR="$(pwd)/root" install
          tar -cvJf "${{ steps.name.outputs.name }}-${{ steps.os_arch.outputs.os_arch }}.tar.xz" -C root .
          sha512sum "${{ steps.name.outputs.name }}-${{ steps.os_arch.outputs.os_arch }}.tar.xz" > "${{ steps.name.outputs.name }}-${{ steps.os_arch.outputs.os_arch }}.tar.xz.sha512"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crosstool-ng-${{ steps.os_arch.outputs.os_arch }}
          path: |
            ${{ steps.name.outputs.name }}-${{ steps.os_arch.outputs.os_arch }}.tar.xz*
            P

  deploy:
    environment: releases
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crosstool-ng-*

      - name: Get tarball name
        id: name
        run: echo "name=$(cat P)" >> $GITHUB_OUTPUT

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ steps.name.outputs.name }}-*.tar.xz*"
          tag: ${{ steps.name.outputs.name }}
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
